<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101D" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle with border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="5" stroke-opacity="0.8" />

  <!-- Subtle corner tech accent -->
  <circle cx="106" cy="22" r="4" fill="#38BDF8" opacity="0.9" filter="url(#cyanGlow)" />

  <!-- "pb" Text Monogram -->
  <text 
    x="64" 
    y="78" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'JetBrains Mono', sans-serif" 
    font-size="64" 
    font-weight="900" 
    letter-spacing="-3"
    fill="url(#textGrad)"
    filter="url(#cyanGlow)">pb</text>
</svg>
